<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Doğruluk Oyunu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Doğruluk Oyunu</h1>
        <button id="joinBtn">Oyuna Katıl</button>
        <div id="gameArea" style="display:none;">
            <p id="question"></p>
            <textarea id="answer" placeholder="Cevabınızı yazın..."></textarea>
            <button id="submitBtn">Gönder</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
